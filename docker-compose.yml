services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 5s
      timeout: 3s
      retries: 10

  analyzers:
    build:
      context: ./analyzers
    ports:
      - "4350:4350"
    environment:
      PORT: 4350
      NODE_OPTIONS: "--max-old-space-size=768"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1.5g

  api:
    build:
      context: .
      dockerfile: src/Tessera.Api/Dockerfile
    environment:
      ConnectionStrings__TesseraDb: "Host=postgres;Port=5432;Database=tessera;Username=tessera;Password=tessera"
      # Dashboard access key (required by the web dashboard):
      Dashboard__ApiKey: "dev-dashboard-key"
      # GitHub App config (ingestion + OAuth login). Fill .env (see README/DEPLOYMENT.md):
      GitHub__AppId: "${GITHUB_APP_ID:-}"
      GitHub__PrivateKeyPath: "/app/secrets/tessera-app.pem"
      GitHub__WebhookSecret: "${GITHUB_WEBHOOK_SECRET:-}"
      GitHub__AppUrl: "http://localhost:3000"
      GitHubOAuth__ClientId: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GitHubOAuth__ClientSecret: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      GitHubOAuth__CallbackUrl: "http://localhost:5080/api/auth/callback"
      GitHubOAuth__WebUrl: "http://localhost:3000"
      Auth__Admins: "${AUTH_ADMINS:-}"
      Ai__RequestsPerMinute: "12"
      # Auth__SessionLifetimeHours: "12"
    ports:
      - "5080:8080"
    volumes:
      - objectsdata:/app/objects
      - ./secrets/tessera-app.pem:/app/secrets/tessera-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g

  worker:
    build:
      context: .
      dockerfile: src/Tessera.Worker/Dockerfile
    environment:
      ConnectionStrings__TesseraDb: "Host=postgres;Port=5432;Database=tessera;Username=tessera;Password=tessera"
      Sidecar__BaseUrl: "http://analyzers:4350"
      Worker__WorkRoot: "/app/work"
      Worker__MaxFilesPerBatch: "1000"
      ObjectStore__Root: "/app/objects"
      # GitHub App config (used to clone private repositories with an installation token):
      GitHub__AppId: "${GITHUB_APP_ID:-}"
      GitHub__PrivateKeyPath: "/app/secrets/tessera-app.pem"
      # LLM provider is configured via Settings > AI (stored in the database).
      # Ai__RequestsPerMinute: "12"
      Ai__RequestsPerMinute: "20"
    volumes:
      - workdata:/app/work
      - objectsdata:/app/objects
      - ./secrets/tessera-app.pem:/app/secrets/tessera-app.pem:ro
      - ./e2e/origin:/repos/e2e-origin:ro
    depends_on:
      postgres:
        condition: service_healthy
      analyzers:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:5080"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m

  copilot-bridge:
    image: ghcr.io/whtsky/copilot2api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - copilot2api-data:/root/.config/copilot2api
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    # First run performs GitHub Device Flow authentication; complete it via
    # `docker compose logs -f copilot-bridge`. Exposes OpenAI-compatible /v1
    # (chat/completions, embeddings, streaming) without validating API keys,
    # so the port is bound to localhost only.

volumes:
  pgdata:
  workdata:
  objectsdata:
  copilot2api-data:
