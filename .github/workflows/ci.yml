name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Tessera.slnx
      - name: Build
        run: dotnet build Tessera.slnx -c Release --no-restore -warnaserror
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analyzers/package-lock.json
      - name: Install analyzer sidecar dependencies
        working-directory: analyzers
        run: npm ci
      - name: Test
        run: dotnet test Tessera.slnx -c Release --no-build

  analyzers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analyzers/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed files for secrets
        shell: pwsh
        run: ./tools/scan-secrets.ps1
